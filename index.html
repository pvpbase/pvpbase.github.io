
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10120f">
    <title>PvPBase — Under Construction</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --bg: #10120f;
            --text: #f2f3ef;
            --muted: #858b80;
            --green: #a5e66e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background */

        .background {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse, black, transparent 75%);
            pointer-events: none;
        }

        .glow {
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(
                circle,
                rgba(140, 205, 88, .10),
                transparent 70%
            );
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Content */

        main {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 30px;
            text-align: center;
            display: flex;
            align-items: center;
            flex-direction: column;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            border: 1px solid rgba(165,230,110,.2);
            background: rgba(165,230,110,.06);
            color: var(--green);
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            50% { opacity: .3; }
        }

        h1 {
            font-size: clamp(58px, 11vw, 115px);
            line-height: 1;
            font-weight: 900;
            letter-spacing: -8px;
        }

        h1 span {
            color: var(--green);
        }

        .subtitle {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
            max-width: 430px;
            margin-top: 25px;
        }

        .divider {
            width: 35px;
            height: 2px;
            background: var(--green);
            margin: 35px 0;
        }

        .discord {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 5px;
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: .2s;
        }

        .discord:hover {
            border-color: var(--green);
            background: rgba(165,230,110,.06);
            transform: translateY(-2px);
        }

        .discord svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        /* Footer */

        footer {
            position: absolute;
            bottom: 28px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #555c51;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        @media(max-width: 600px) {
            h1 {
                letter-spacing: -4px;
            }

            .subtitle {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="background"></div>
    <div class="glow"></div>

    <main>
        <div class="status">
            <span class="status-dot"></span>
            Currently under construction
        </div>

        <h1>PvP<span>Base</span></h1>

        <p class="subtitle">
            We're building something new for the
            Minecraft PvP community.<br>
            There's nothing here. Yet.
        </p>

        <div class="divider"></div>

        <a class="discord" href="https://dsc.g/pvpbase" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24">
                <path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3a13.7 13.7 0 0 0-.6 1.2 18.4 18.4 0 0 0-5.6 0A13.7 13.7 0 0 0 8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 8.9-.2 13.3.2 17.7a20 20 0 0 0 6 3.1l1.3-2.1-2-1 0 0a14 14 0 0 0 12.9 0l0 0-2 1 1.3 2.1a20 20 0 0 0 6-3.1c.5-5.1-.8-9.5-3.4-13.3ZM8 14.8c-1.2 0-2.1-1.1-2.1-2.4S6.8 10 8 10s2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4Zm8 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4Z"/>
            </svg>
            Join our Discord
        </a>
    </main>

    <footer>
        © 2026 PvPBase
    </footer>
</body>
</html>
